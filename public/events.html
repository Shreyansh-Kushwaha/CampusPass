<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Allura&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27none%27 stroke=%27%231f3d2b%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23b08d3c%27/%3E%3C/svg%3E">
<title>Events · CampusPass</title>
</head>
<body>
<header class="nav" id="nav"></header>
<main>

<section class="detail-head">
  <div class="container">
    <span class="eyebrow">Programme</span>
    <h1>All events</h1>
    <p class="lede">Everything happening across campus, in one place.</p>
  </div>
</section>
<section class="section" style="padding-top:2.5rem">
  <div class="container">
    <div class="toolbar">
      <div class="search"><span id="searchIcon"></span><input type="search" id="search" placeholder="Search events" aria-label="Search events"></div>
      <div class="chips" id="chips"></div>
      <div class="tabs" style="margin:0;border:0;margin-left:auto">
        <button class="tab active" data-scope="upcoming">Upcoming</button>
        <button class="tab" data-scope="past">Past</button>
      </div>
    </div>
    <p class="muted small" id="resultCount"></p>
    <div class="grid grid-3" id="eventGrid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</section>
</main>
<footer id="footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/events.js"></script>
</body>
</html>
